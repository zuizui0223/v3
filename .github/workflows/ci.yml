name: v3-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: python -m pytest -q
      - name: Build anonymous MEE source
        if: matrix.python-version == '3.11'
        run: python scripts/build_observation_mee_source.py
      - name: Check MEE readiness
        if: matrix.python-version == '3.11'
        run: python scripts/check_observation_mee_submission.py
      - name: Upload anonymous MEE production artifacts
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: observation-mee-review-source
          path: |
            submission/generated/MEE_INITIAL_SUBMISSION_SOURCE.md
            submission/generated/initial_submission_readiness.json
            manuscript/observation_references.bib
          retention-days: 14
