name: v3-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: python -m pytest -q
      - name: Generate M4 quantitative figures
        if: matrix.python-version == '3.11'
        run: python scripts/make_m4_quantitative_figures.py
      - name: Upload M4 production artifacts
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: m4-v3-rec-quantitative-figures
          path: |
            manuscript/generated_m4/*.svg
            manuscript/generated_m4/*.csv
            manuscript/M4_V3_REC_CLAIM_MANIFEST.json
            manuscript/M4_FIGURE_PLAN.md
            submission/M4_REVIEWER_PACKAGE_MANIFEST.json
          retention-days: 14
